<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Tela final</title>
        <style>
             body{
                background-color: #161b22;
                color: #e2e2e2;
                font-family: 'Times New Roman', Times, serif;
                line-height: 1.6;
                margin: 20px;
                background-image: url(https://i.pinimg.com/1200x/d8/73/eb/d873eb7dd1f257a57a45887c14492e5c.jpg);
                background-size: cover;
                background-attachment: fixed;
            }
            h1,h2,h3{
                color:#aecffa;
                text-align: center;
            }
            img {
                max-width: 100%;
                width: auto;
                height: 100%;
                display: block;
                margin: 20px auto;
                border-radius: 15px;
                border: 3px solid #d3d5db;
            }
            button{
                background-color: #aecffa;
                color: white;
                cursor: pointer;
                font-weight: bold;
                border: none;
                transition: all 0.1s;
            }

            button:hover{
                background-color: #aecffa;
                box-shadow: 0 0 15px #aecffa;
                transform: scale(1.10);
            }

            input,select,button{
                width: 100%;
                padding: 12px;
                box-sizing: border-box;
                border-radius: 5px;
                border: 1px solid #444;
                margin-bottom: 15px;
                background-color: #aecffa;
                color: white;
            }
            main{
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
            }

            section{
                background-color: #161b22;
                padding: 40px;
                margin-bottom: 40px;
                border-radius: 15px;
                border: 1px solid #333;
                box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            }

           img {
                max-width: 100%;
                width: auto;
                height: 100%;
                display: block;
                margin: 20px auto;
                border-radius: 15px;
                border: 3px solid #d3d5db;
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <h1>Bem-vindo(a) ao GlobeWay!</h1>
                <p>Obrigado por visitar nosso site e se cadastrar. Estamos animados para ajudá-lo(a) a explorar novas oportunidades de intercâmbio e viver experiências incríveis ao redor do mundo!</p>
                <img src="Aeroporto.jpg" alt="">
            </section>
        </main>
    </body>
</html>
